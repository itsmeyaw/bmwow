      - generic [ref=f8e574]:
        - generic [ref=f8e575]:
          - heading "Why" [level=3] [ref=f8e576]
          - paragraph [ref=f8e577]: "Judged by the LLM with a fixed rubric; checked by code rules (passed). Code suggested: gap (customers only)."
        - paragraph [ref=f8e578]: "Customers describe a mixed service-support issue rather than one specific documentation defect: Owner’s Manual problems (9 of 69 problem items), Tirefit (7), Teleservices (4), and My BMW / MINI Portal access (3); one customer also says the dealer/importer did not resolve reported defects despite repeated inquiries. [fb:evidence:bmw-feedback:G60-1562] [fb:evidence:bmw-feedback:G60-0612] [fb:evidence:bmw-feedback:G60-1048] [fb:evidence:bmw-feedback:G60-0783] [fb:evidence:bmw-feedback:G60-3229]"
        - paragraph [ref=f8e579]:
          - text: The clearest themes are Owner’s Manual, Tirefit, Teleservices, and portal support; requests also include Owner’s Manual (6 of 18 request items) and Accessories / Parts (5 of 18), so the wish is for clearer or more accessible ownership and service support, not solely more documents.
          - generic "fb:evidence:bmw-feedback:G60-1562" [ref=f8e580]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-0612" [ref=f8e581]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-1048" [ref=f8e582]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-0783" [ref=f8e583]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-0008" [ref=f8e584]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-0121" [ref=f8e585]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-1562, fb:evidence:bmw-feedback:G60-0612, fb:evidence:bmw-feedback:G60-1048, fb:evidence:bmw-feedback:G60-0783, fb:evidence:bmw-feedback:G60-0008, fb:evidence:bmw-feedback:G60-0121" [ref=f8e586]: 6 src
          - text: Problems are limited in the all-region customer data at 1.9% (69 of 3,677; 95% CI 1.5%–2.4%), with US at 1.8% (65 of 3,610; CI 1.4%–2.3%); EU is 6.0% (4 of 67; CI 2.4%–14.4%) but explicitly a thin sample, so it does not establish broad prevalence.
          - generic "F-feedback-241" [ref=f8e587]: 1 src
          - generic "F-feedback-242" [ref=f8e588]: 1 src
          - generic "F-feedback-243" [ref=f8e589]: 1 src
          - generic "F-feedback-241, F-feedback-242, F-feedback-243" [ref=f8e590]: 3 src
          - text: The package reports a significant US–EU difference in problem share (p=0.013), but the EU result rests on only four problem reports; strength is also higher in the small EU sample (7.5%, 5 of 67) than in the US (1.1%, 39 of 3,610), so the regional picture is mixed.
          - generic "F-feedback-241" [ref=f8e591]: 1 src
          - generic "F-feedback-242" [ref=f8e592]: 1 src
          - generic "F-feedback-246" [ref=f8e593]: 1 src
          - generic "F-feedback-247" [ref=f8e594]: 1 src
          - generic "F-feedback-241, F-feedback-242, F-feedback-246, F-feedback-247" [ref=f8e595]: 4 src
          - text: There is no customer breakdown by engine type, so the evidence does not show whether the issue differs among ICE, PHEV, and BEV versions.
          - generic "F-feedback-241" [ref=f8e596]: 1 src
          - generic "F-feedback-242" [ref=f8e597]: 1 src
          - generic "F-feedback-243" [ref=f8e598]: 1 src
          - generic "F-feedback-241, F-feedback-242, F-feedback-243" [ref=f8e599]: 3 src
          - text: No trend evidence is available for the regions, so the package cannot establish whether this issue will become more or less important for a launch in 3–5 years.
          - generic "F-feedback-243" [ref=f8e600]: 1 src
          - generic "F-feedback-243" [ref=f8e601]: 1 src
          - text: No direct safety concern is evidenced, but unresolved service issues and support are relevant to the premium ownership experience; customer evidence also includes praise for follow-up service.
          - generic "fb:evidence:bmw-feedback:G60-3229" [ref=f8e602]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-2588" [ref=f8e603]: 1 src
          - generic "fb:evidence:bmw-feedback:G60-3229, fb:evidence:bmw-feedback:G60-2588" [ref=f8e604]: 2 src
          - text: The rule-based suggestion is gap, and the customer problem reports support that assessment; confidence is moderated because the evidence spans varied sub-themes and there is no current-model catalog value, competitor comparison, or trend evidence.
          - generic "F-feedback-243" [ref=f8e605]: 1 src
