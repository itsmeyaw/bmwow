          - paragraph [ref=f8e569]: This matters to customers because the Owner’s Manual is named in 9 of 69 problem items and 6 of 18 request items.
          - paragraph [ref=f8e570]: "Acceptance: service docs support: target value to be set by the PM · verified by to be defined"
          - list [ref=f8e571]:
