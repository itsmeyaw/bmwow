[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bmwow"
version = "0.2.0"
description = "BMWow Python reference implementation (ontology, knowledge, agents); ported to TypeScript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "firecrawl-py>=4.50,<5",
  "langchain>=1.4,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1.7,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "rfc3986-validator>=0.1.1,<0.2",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
bmwow-schema = "bmwow.ontology.schema:main"
bmwow-validate = "bmwow.ontology.validation:main"

[dependency-groups]
dev = [
  "jsonschema[format-nongpl]>=4.18,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["bmwow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
