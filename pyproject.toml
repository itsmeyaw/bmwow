[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bmwow"
version = "0.2.0"
description = "BMW hackathon product decision ontology and Python backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "rfc3986-validator>=0.1.1,<0.2",
]

[project.scripts]
bmwow-schema = "bmwow.ontology.schema:main"
bmwow-validate = "bmwow.ontology.validation:main"

[dependency-groups]
dev = [
  "jsonschema[format-nongpl]>=4.18,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/bmwow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".cursor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
